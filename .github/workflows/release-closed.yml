name: Release Harness
on:
  workflow_dispatch:
    inputs:
      serving:
        description: Configure the API and its isolated queue worker; database admission and webhook remain separate.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: harness-production-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository_id == '1456180919' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.repository_id == '1456180919' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.image_artifact_id }}
          path: verified-image
          merge-multiple: true
      - env:
          ARCHIVE_SHA: ${{ needs.verify.outputs.image_archive_sha }}
        run: python3 scripts/release-image.py load verified-image "$GITHUB_SHA" "$ARCHIVE_SHA"
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_PUBLISH_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: publish
        shell: bash
        run: |
          set -euo pipefail
          image="alive.azurecr.io/hhc-line-harness:main-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az acr login --name alive --only-show-errors
          docker tag "line-harness:$GITHUB_SHA" "$image"
          docker push "$image"
          docker pull "$image"
          python3 - "$image" <<'PY'
          import importlib.util, json, os, subprocess, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release_image', 'scripts/release-image.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          expected = json.loads(Path('verified-image/image.json').read_text())
          assert module.fingerprint(sys.argv[1], os.environ['GITHUB_SHA']) == expected['fingerprint']
          refs = json.loads(subprocess.check_output(['docker','image','inspect',sys.argv[1]]))[0]['RepoDigests']
          refs = [ref for ref in refs if ref.startswith('alive.azurecr.io/hhc-line-harness@sha256:')]
          assert len(refs) == 1
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out: out.write('image='+refs[0]+'\n')
          PY
  deploy:
    needs: [verify, publish]
    if: github.repository_id == '1456180919' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      SERVING: ${{ inputs.serving }}
      RUNTIME_SECRET_URIS: ${{ vars.RUNTIME_SECRET_URIS }}
      LINE_RUNTIME_IDENTITIES: ${{ vars.LINE_RUNTIME_IDENTITIES }}
      API_DATABASE_SECRET_URI: ${{ vars.API_DATABASE_SECRET_URI }}
      MIGRATE_DATABASE_SECRET_URI: ${{ vars.MIGRATE_DATABASE_SECRET_URI }}
      LINE_CHANNEL_SECRET_URI: ${{ vars.LINE_CHANNEL_SECRET_URI }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and verify bounded migration
        shell: bash
        run: python3 scripts/closed-release.py migrate "$IMAGE" | tee migration-receipt.json
      - name: Deploy and verify private API
        shell: bash
        run: python3 scripts/closed-release.py api "$IMAGE" | tee api-receipt.json
      - name: Deploy and verify isolated queue worker
        if: inputs.serving
        shell: bash
        run: python3 scripts/closed-release.py worker "$IMAGE" | tee worker-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: closed-release-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: '*-receipt.json'
          if-no-files-found: warn
          retention-days: 30
